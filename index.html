<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07142b">
<title>Delta Waters International School | The Mind is the Man</title>
<style>
:root{
  --navy:#07142b;
  --navy-mid:#0d2147;
  --royal:#1d4ed8;
  --royal-bright:#3b82f6;
  --royal-soft:#dbeafe;
  --gold:#f59e0b;
  --amber:#fbbf24;
  --emerald:#16a34a;
  --ink:#0f172a;
  --muted:#475569;
  --bg:#f4f7fc;
  --line:#dbe4f0;
  --white:#ffffff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
.wrap{width:min(1160px,calc(100% - 40px));margin:auto}

/* Royal Blue Checkered Uniform Pattern */
.gingham-strip{
  height:8px;
  background-color:#ffffff;
  background-image:
    linear-gradient(90deg, rgba(29,78,216,.38) 50%, transparent 50%),
    linear-gradient(rgba(29,78,216,.38) 50%, transparent 50%);
  background-size:14px 14px;
}
.gingham-bg{
  background-color:#eff6ff;
  background-image:
    linear-gradient(90deg, rgba(29,78,216,.07) 50%, transparent 50%),
    linear-gradient(rgba(29,78,216,.07) 50%, transparent 50%);
  background-size:22px 22px;
}

/* Top Utility Bar */
.top{background:var(--navy);color:#cbd5e1;padding:9px 0;font-size:.82rem;border-bottom:1px solid #ffffff14}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.top a{color:var(--amber);font-weight:600}

/* Sticky Glass Header */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
header .wrap{height:80px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:1.05rem;color:var(--navy);letter-spacing:-.02em}
.brand span small{display:block;font-size:.72rem;font-weight:700;color:var(--royal);letter-spacing:.04em;text-transform:uppercase}
.crest-badge{
  width:46px;height:46px;border-radius:14px;
  background:radial-gradient(circle at 30% 30%, var(--navy-mid), var(--navy));
  display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(7,20,43,.22);
  flex:none;
}
.links{display:flex;gap:24px;font-size:.92rem;font-weight:700;color:var(--navy)}
.links a{position:relative;padding:4px 0}
.links a:after{content:"";position:absolute;left:0;bottom:0;width:0;height:2.5px;background:var(--royal);border-radius:2px;transition:.25s}
.links a:hover:after{width:100%}
.actions{display:flex;gap:10px;align-items:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:999px;padding:12px 20px;font-weight:750;font-size:.92rem;
  cursor:pointer;background:var(--royal);color:white;
  box-shadow:0 8px 20px rgba(29,78,216,.24);
  transition:transform .18s, background .18s, box-shadow .18s;
}
.btn:hover{background:#1e40af;transform:translateY(-1px);box-shadow:0 12px 24px rgba(29,78,216,.32)}
.btn.navy{background:var(--navy);box-shadow:0 8px 20px rgba(7,20,43,.2)}
.btn.navy:hover{background:var(--navy-mid)}
.btn.gold{background:linear-gradient(135deg,var(--amber),var(--gold));color:var(--navy);box-shadow:0 8px 22px rgba(245,158,11,.32)}
.btn.gold:hover{filter:brightness(1.04)}
.btn.outline{background:white;color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.outline:hover{border-color:var(--royal);color:var(--royal)}
.menu{display:none;border:0;background:none;color:var(--navy);font-size:1.6rem;cursor:pointer}

/* Hero Section */
.hero{padding:28px 0 44px}
.hero-box{
  position:relative;overflow:hidden;
  border-radius:30px;
  background:radial-gradient(circle at 85% 20%, #1d4ed8 0%, #0d2147 48%, #07142b 100%);
  color:white;
  padding:clamp(32px,5.5vw,68px);
  display:grid;grid-template-columns:1.12fr .88fr;align-items:center;gap:32px;
  box-shadow:0 24px 60px rgba(7,20,43,.24);
}
/* Subtle Checkered Texture Overlay in Hero */
.hero-box:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(90deg, rgba(255,255,255,.035) 50%, transparent 50%),
    linear-gradient(rgba(255,255,255,.035) 50%, transparent 50%);
  background-size:28px 28px;
}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  padding:6px 14px;border-radius:999px;
  font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--amber);
}
h1{font-size:clamp(2.4rem,5vw,4.3rem);line-height:1.04;letter-spacing:-.04em;margin:16px 0}
.hero-copy p{color:#dbeafe;font-size:1.05rem;max-width:500px;margin:0 0 26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* Animated Water Lily Emblem Showcase */
.crest-stage{
  position:relative;height:360px;display:grid;place-items:center;
}
.ripple{
  position:absolute;border-radius:50%;
  border:1.5px solid rgba(96,165,250,.35);
  animation:rippleWave 5s infinite ease-out;
}
.ripple.r1{width:220px;height:220px;animation-delay:0s}
.ripple.r2{width:290px;height:290px;animation-delay:1.6s}
.ripple.r3{width:350px;height:350px;animation-delay:3.2s}
@keyframes rippleWave{
  0%{transform:scale(.82);opacity:.75}
  100%{transform:scale(1.18);opacity:0}
}
.crest-medallion{
  position:relative;z-index:2;
  width:255px;height:255px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%, #112a57, #061022);
  border:3px solid rgba(251,191,36,.55);
  box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 0 30px rgba(59,130,246,.28);
  display:grid;place-items:center;
  animation:floatLily 4.5s ease-in-out infinite;
}
@keyframes floatLily{
  0%,100%{transform:translateY(0px)}
  50%{transform:translateY(-8px)}
}
.lily-petals{transform-origin:120px 125px;animation:bloomBreath 4.5s ease-in-out infinite}
@keyframes bloomBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
.float-pill{
  position:absolute;z-index:3;
  background:rgba(255,255,255,.96);color:var(--navy);
  border-radius:16px;padding:11px 15px;
  box-shadow:0 14px 32px rgba(7,20,43,.28);
  font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:10px;
}
.float-pill small{display:block;color:var(--muted);font-weight:600;font-size:.73rem}
.fp1{left:0;top:24px}
.fp2{right:0;bottom:22px}

/* Mom-Proof Big Action Dock */
.dock{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  margin-top:-26px;position:relative;z-index:5;padding:0 14px;
}
.dock-btn{
  background:white;border:1.5px solid var(--line);border-radius:20px;
  padding:18px;display:flex;align-items:center;gap:14px;text-align:left;
  cursor:pointer;box-shadow:0 12px 30px rgba(7,20,43,.08);
  transition:.22s;
}
.dock-btn:hover{transform:translateY(-4px);border-color:var(--royal);box-shadow:0 18px 38px rgba(29,78,216,.15)}
.dock-num{
  width:44px;height:44px;border-radius:14px;flex:none;
  background:var(--royal-soft);color:var(--royal);
  display:grid;place-items:center;font-size:1.25rem;font-weight:850;
}
.dock-btn strong{display:block;font-size:.98rem;color:var(--navy)}
.dock-btn small{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}

/* Sections & Scroll Reveal */
.section{padding:72px 0}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .65s ease, transform .65s ease}
.reveal.in{opacity:1;transform:none}
.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}
.label{color:var(--royal);font-size:.78rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
.heading h2{font-size:clamp(1.9rem,3.3vw,2.8rem);line-height:1.1;letter-spacing:-.04em;color:var(--navy);margin:8px 0 0}
.heading p{color:var(--muted);max-width:440px;margin:0;font-size:.98rem}

/* Interactive Campus & Aquatics Showcase */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.tab{
  padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);
  background:white;color:var(--navy);font-weight:750;font-size:.9rem;cursor:pointer;transition:.2s;
}
.tab.active,.tab:hover{background:var(--navy);color:white;border-color:var(--navy)}
.showcase-card{
  background:white;border:1px solid var(--line);border-radius:26px;
  overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;
  box-shadow:0 18px 45px rgba(7,20,43,.07);
}
.showcase-art{
  min-height:310px;position:relative;display:grid;place-items:center;
  background:linear-gradient(135deg,#0d2147,#1d4ed8);padding:24px;
}
.showcase-body{padding:clamp(26px,4vw,44px);display:flex;flex-direction:column;justify-content:center}
.showcase-body h3{font-size:1.65rem;color:var(--navy);margin:8px 0 12px;letter-spacing:-.03em}
.showcase-body p{color:var(--muted);margin:0 0 20px}
.tag-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tag{background:var(--royal-soft);color:var(--navy);font-size:.8rem;font-weight:750;padding:6px 12px;border-radius:999px}

/* Academic Pathways Cards */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stage-card{
  background:white;border:1.5px solid var(--line);border-radius:22px;padding:24px;
  display:flex;flex-direction:column;transition:.22s;
}
.stage-card:hover{transform:translateY(-4px);border-color:var(--royal);box-shadow:0 16px 36px rgba(7,20,43,.09)}
.stage-badge{
  align-self:flex-start;background:var(--navy);color:var(--amber);
  font-size:.73rem;font-weight:800;padding:5px 11px;border-radius:999px;margin-bottom:14px;
}
.stage-card h3{margin:0 0 8px;color:var(--navy);font-size:1.15rem}
.stage-card p{color:var(--muted);font-size:.88rem;margin:0 0 18px;flex:1}
.link{color:var(--royal);font-weight:800;font-size:.88rem;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}

/* Embedded Estimator & Quick Enrollment Split */
.planner{
  background:white;border:1.5px solid var(--line);border-radius:28px;
  padding:clamp(24px,4vw,44px);
  display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;
  box-shadow:0 18px 45px rgba(7,20,43,.06);
}
.field{display:grid;gap:6px;margin:13px 0}
.field label{font-size:.84rem;font-weight:750;color:var(--navy)}
.field input,.field select{
  padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;width:100%;
  background:#f8fafc;color:var(--ink);font-weight:600;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--royal);background:white}
.est-panel{
  background:var(--navy);color:white;border-radius:22px;padding:28px;
  position:relative;overflow:hidden;
}
.est-panel:after{
  content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;
  border-radius:50%;background:rgba(59,130,246,.18);
}
.est-line{display:flex;justify-content:space-between;color:#cbd5e1;font-size:.92rem;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.est-big{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.est-big span{color:#93c5fd;font-weight:700}
.est-big strong{font-size:2.1rem;color:var(--amber);letter-spacing:-.03em}

/* News Cards */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.story{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}
.story:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(7,20,43,.08)}
